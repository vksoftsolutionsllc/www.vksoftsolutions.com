    <style>
      /* Inline so the preloader paints before the CSS bundle arrives. */
      #preloader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#040B1A;transition:opacity .6s,visibility .6s}
      #preloader.done{opacity:0;visibility:hidden}
      #preloader img{width:120px;animation:pl-pulse 1.2s ease-in-out infinite}
      #preloader span{position:absolute;width:170px;height:170px;border-radius:50%;border:2px solid rgba(143,186,255,.15);border-top-color:#8FBAFF;animation:pl-spin 1s linear infinite}
      @keyframes pl-pulse{50%{opacity:.55;transform:scale(.96)}}
      @keyframes pl-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
